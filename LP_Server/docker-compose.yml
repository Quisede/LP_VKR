services:
  db:
    image: postgres:15
    container_name: lms_db
    restart: always
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: lms_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: lms
      PGUSER: postgres
      PGPASSWORD: postgres
    ports:
      - "8080:8080"

  qt_client:
    build:
      context: .
      dockerfile: client-qt/LMSClient/Dockerfile.qt
    container_name: lms_qt_client
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      LMS_API_BASE_URL: http://app:8080
      QT_QPA_PLATFORM: offscreen
    volumes:
      - .:/workspace
      - ./artifacts/qt-client:/artifacts
    profiles:
      - qt

volumes:
  postgres_data:
